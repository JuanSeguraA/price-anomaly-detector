name: daily report

on:
  schedule:
    # 13:30 UTC, a bit after US markets open, so yfinance has fresh data
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run price-anomaly-detector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m price_anomaly_detector ${{ secrets.ANTHROPIC_API_KEY != '' && '--llm-commentary' || '' }}

      - name: Commit report if one was generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "add daily report for $(date -u +%Y-%m-%d)"
          git push
